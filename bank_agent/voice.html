<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank Agent Voice</title>
<style>
body { font: 16px system-ui; margin: 0; background: #eef3f8; color: #172033; }
main { max-width: 760px; margin: 40px auto; padding: 24px; }
section { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 8px 30px #17324d18; }
button { font: inherit; padding: 12px 18px; border: 0; border-radius: 9px; background: #1769e0; color: #fff; cursor: pointer; margin-right: 8px; }
button.secondary { background: #e7edf5; color: #172033; }
.status { color: #52606d; }
.turn { padding: 12px 0; border-top: 1px solid #e5e7eb; }
.user { color: #1769e0; }
.agent { color: #166534; }
#meter { height: 8px; background: #e5e7eb; border-radius: 8px; overflow: hidden; margin: 18px 0; }
#level { height: 100%; width: 0; background: #22c55e; transition: width .08s; }
</style>
<main>
  <section>
    <h1>Bank Agent 语音测试</h1>
    <p class="status" id="status">尚未连接</p>
    <div id="meter"><div id="level"></div></div>
    <p>
      <button id="start">开始语音</button>
      <button id="finish" class="secondary" disabled>暂停说话</button>
      <button id="stop" class="secondary" disabled>停止会话</button>
    </p>
    <div id="turns"></div>
  </section>
</main>
<script>
let peerConnection;
let audioStream;
let dataChannel;
let audioContext;
let analyser;
let meterTimer;
let agentSpeaking = false;
let speechGeneration = 0;

const statusEl = document.querySelector('#status');
const turnsEl = document.querySelector('#turns');
const startButton = document.querySelector('#start');
const finishButton = document.querySelector('#finish');
const stopButton = document.querySelector('#stop');
const levelEl = document.querySelector('#level');

function addTurn(kind, text) {
  const row = document.createElement('div');
  row.className = `turn ${kind}`;
  row.textContent = `${kind === 'user' ? '你' : 'Agent'}：${text}`;
  turnsEl.prepend(row);
}

function setMicrophoneEnabled(enabled) {
  audioStream?.getAudioTracks().forEach(track => { track.enabled = enabled; });
}

function speak(text) {
  const generation = ++speechGeneration;
  speechSynthesis.cancel();
  agentSpeaking = true;
  setMicrophoneEnabled(false);
  finishButton.disabled = true;
  statusEl.textContent = 'Agent 正在播报…';
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';
  utterance.rate = 1.05;
  const resumeListening = () => {
    if (generation !== speechGeneration) return;
    agentSpeaking = false;
    setMicrophoneEnabled(true);
    if (dataChannel?.readyState === 'open') {
      finishButton.disabled = false;
      statusEl.textContent = '请继续说话';
    }
  };
  utterance.onend = resumeListening;
  utterance.onerror = resumeListening;
  speechSynthesis.speak(utterance);
}

function handleMessage(message) {
  const event = JSON.parse(message.data);
  if (event.type === 'status' && !agentSpeaking) statusEl.textContent = event.text;
  if (event.type === 'capture' && !agentSpeaking) finishButton.disabled = !event.enabled;
  if (event.type === 'transcript') addTurn('user', event.text);
  if (event.type === 'response') {
    addTurn('agent', event.text);
    speak(event.text);
  }
  if (event.type === 'error') statusEl.textContent = `错误：${event.text}`;
}

function startMeter(stream) {
  audioContext = new AudioContext();
  const source = audioContext.createMediaStreamSource(stream);
  analyser = audioContext.createAnalyser();
  source.connect(analyser);
  const values = new Uint8Array(analyser.frequencyBinCount);
  meterTimer = setInterval(() => {
    analyser.getByteFrequencyData(values);
    const average = values.reduce((sum, value) => sum + value, 0) / values.length;
    levelEl.style.width = `${Math.min(100, average * 2)}%`;
  }, 80);
}

function waitForIceGathering(connection, timeoutMs = 4000) {
  return new Promise(resolve => {
    if (connection.iceGatheringState === 'complete') {
      resolve();
      return;
    }
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      connection.removeEventListener('icegatheringstatechange', handleStateChange);
      resolve();
    };
    const handleStateChange = () => {
      if (connection.iceGatheringState === 'complete') finish();
    };
    const timer = setTimeout(finish, timeoutMs);
    connection.addEventListener('icegatheringstatechange', handleStateChange);
  });
}

function microphoneError(error) {
  const messages = {
    NotAllowedError: '麦克风权限被拒绝，请在浏览器地址栏中允许麦克风后重试',
    NotFoundError: '未找到可用的麦克风',
    NotReadableError: '麦克风正被其他应用占用',
  };
  return messages[error.name] || error.message || '无法访问麦克风';
}

async function cleanup() {
  clearInterval(meterTimer);
  meterTimer = undefined;
  agentSpeaking = false;
  speechGeneration += 1;
  speechSynthesis.cancel();
  audioStream?.getTracks().forEach(track => track.stop());
  audioStream = undefined;
  dataChannel?.close();
  dataChannel = undefined;
  peerConnection?.close();
  peerConnection = undefined;
  if (audioContext && audioContext.state !== 'closed') await audioContext.close();
  audioContext = undefined;
  levelEl.style.width = '0';
  startButton.disabled = false;
  finishButton.disabled = true;
  stopButton.disabled = true;
}

async function requestVoiceAnswer() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    return await fetch('/voice/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sdp: peerConnection.localDescription.sdp,
        type: peerConnection.localDescription.type,
      }),
      signal: controller.signal,
    });
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('语音服务连接超时');
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

async function startVoice() {
  startButton.disabled = true;
  statusEl.textContent = '请求麦克风权限…';
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (error) {
    throw new Error(microphoneError(error));
  }
  startMeter(audioStream);
  stopButton.disabled = false;
  statusEl.textContent = '麦克风已就绪，正在建立 WebRTC 连接…';
  peerConnection = new RTCPeerConnection();
  peerConnection.onconnectionstatechange = () => {
    if (peerConnection.connectionState === 'connecting') statusEl.textContent = '正在连接语音服务…';
    if (['failed', 'disconnected'].includes(peerConnection.connectionState)) {
      statusEl.textContent = '连接中断，请停止后重试';
    }
  };
  audioStream.getTracks().forEach(track => peerConnection.addTrack(track, audioStream));
  dataChannel = peerConnection.createDataChannel('events');
  dataChannel.onmessage = handleMessage;
  dataChannel.onopen = () => {
    statusEl.textContent = '已连接，请开始说话';
    finishButton.disabled = false;
  };
  dataChannel.onclose = () => {
    if (peerConnection && peerConnection.connectionState !== 'closed') statusEl.textContent = '连接已关闭';
  };
  await peerConnection.setLocalDescription(await peerConnection.createOffer());
  statusEl.textContent = '正在收集网络连接信息…';
  await waitForIceGathering(peerConnection);
  statusEl.textContent = '正在连接语音服务…';
  const response = await requestVoiceAnswer();
  if (!response.ok) {
    let detail = '连接失败';
    try {
      detail = (await response.json()).detail || detail;
    } catch {}
    throw new Error(detail);
  }
  await peerConnection.setRemoteDescription(await response.json());
}

async function stopVoice() {
  await cleanup();
  statusEl.textContent = '已停止';
}

function finishSpeaking() {
  if (!dataChannel || dataChannel.readyState !== 'open') {
    statusEl.textContent = '语音连接尚未就绪';
    return;
  }
  finishButton.disabled = true;
  statusEl.textContent = '正在提交本轮语音…';
  dataChannel.send(JSON.stringify({ type: 'end_utterance' }));
}

startButton.onclick = () => startVoice().catch(async error => {
  await cleanup();
  statusEl.textContent = `错误：${error.message}`;
});
finishButton.onclick = finishSpeaking;
stopButton.onclick = stopVoice;
</script>
</html>
