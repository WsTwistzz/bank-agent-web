<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank Agent Voice</title>
<style>
body{font:16px system-ui;margin:0;background:#eef3f8;color:#172033}main{max-width:760px;margin:40px auto;padding:24px}section{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #17324d18}button{font:inherit;padding:12px 18px;border:0;border-radius:9px;background:#1769e0;color:#fff;cursor:pointer;margin-right:8px}button.secondary{background:#e7edf5;color:#172033}.status{color:#52606d}.turn{padding:12px 0;border-top:1px solid #e5e7eb}.user{color:#1769e0}.agent{color:#166534}#meter{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin:18px 0}#level{height:100%;width:0;background:#22c55e;transition:width .08s}</style>
<main><section><h1>Bank Agent 语音测试</h1><p class="status" id="status">尚未连接</p><div id="meter"><div id="level"></div></div><p><button id="start">开始语音</button><button id="stop" class="secondary" disabled>停止</button></p><div id="turns"></div></section></main>
<script>
let pc, stream, dc, audioContext, analyser, meterTimer;
const statusEl=document.querySelector('#status'), turns=document.querySelector('#turns'), startButton=document.querySelector('#start'), stopButton=document.querySelector('#stop'), levelEl=document.querySelector('#level');
function addTurn(kind,text){const row=document.createElement('div');row.className=`turn ${kind}`;row.textContent=`${kind==='user'?'你':'Agent'}：${text}`;turns.prepend(row)}
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.05;speechSynthesis.speak(u)}
function handle(message){const event=JSON.parse(message.data);if(event.type==='status')statusEl.textContent=event.text;if(event.type==='transcript')addTurn('user',event.text);if(event.type==='response'){addTurn('agent',event.text);speak(event.text)}if(event.type==='error')statusEl.textContent=`错误：${event.text}`}
function meter(s){audioContext=new AudioContext();const source=audioContext.createMediaStreamSource(s);analyser=audioContext.createAnalyser();source.connect(analyser);const values=new Uint8Array(analyser.frequencyBinCount);meterTimer=setInterval(()=>{analyser.getByteFrequencyData(values);const avg=values.reduce((a,b)=>a+b,0)/values.length;levelEl.style.width=`${Math.min(100,avg*2)}%`},80)}
async function startVoice(){statusEl.textContent='请求麦克风权限…';stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});pc=new RTCPeerConnection();stream.getTracks().forEach(t=>pc.addTrack(t,stream));dc=pc.createDataChannel('events');dc.onmessage=handle;dc.onopen=()=>statusEl.textContent='已连接，请开始说话';dc.onclose=()=>statusEl.textContent='连接已关闭';await pc.setLocalDescription(await pc.createOffer());await new Promise(resolve=>{if(pc.iceGatheringState==='complete')resolve();else pc.addEventListener('icegatheringstatechange',()=>pc.iceGatheringState==='complete'&&resolve())});const response=await fetch('/voice/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:pc.localDescription.sdp,type:pc.localDescription.type})});if(!response.ok)throw new Error((await response.json()).detail||'连接失败');await pc.setRemoteDescription(await response.json());meter(stream);startButton.disabled=true;stopButton.disabled=false}
async function stopVoice(){clearInterval(meterTimer);speechSynthesis.cancel();stream?.getTracks().forEach(t=>t.stop());pc?.close();audioContext?.close();startButton.disabled=false;stopButton.disabled=true;statusEl.textContent='已停止'}
startButton.onclick=()=>startVoice().catch(e=>statusEl.textContent=`错误：${e.message}`);stopButton.onclick=stopVoice;
</script>
</html>
