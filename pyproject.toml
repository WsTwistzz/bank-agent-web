[project]
name = "bank-agent"
version = "0.1.0"
description = "A secure AI banking agent built with LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx[socks]>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "prompt-toolkit>=3.0,<4",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
voice = [
    "aiortc>=1.13,<2",
    "av>=14,<17",
    "numpy>=2,<3",
]

[tool.uv]
package = false
