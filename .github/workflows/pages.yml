name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'bank-agent-web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bank-agent-web/package-lock.json

      - name: Install dependencies
        working-directory: bank-agent-web
        run: npm ci

      # 静态托管没有 Mock Bank / Agent 桥接，构建时打开演示数据开关，
      # base 指向仓库子路径（https://<user>.github.io/<repo>/）。
      - name: Build
        working-directory: bank-agent-web
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE: '/${{ github.event.repository.name }}/'
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bank-agent-web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
